site_name: Lumen
site_description: Luz sobre o sistema — documenta o que existe e constrói o que vem a seguir.
theme:
  name: material
  palette:
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
nav:
  - Início: index.md
  - Começando: getting-started.md
  - O ciclo: the-cycle.md
  - Os agentes: agents.md
  - O motor de execução: engine.md
  - Roadmap: roadmap.md
